<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA+ Space Explorer</title>
  <!-- Google Font to align closer with NASA's web style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Speed up first image fetch by preconnecting to the thumbnail proxy CDN -->
  <link rel="preconnect" href="https://images.weserv.nl" crossorigin>
  <!-- Warm up NASA API and fallback CDN to reduce first-click latency -->
  <link rel="preconnect" href="https://api.nasa.gov" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  <!-- Site favicon (NASA meatball logo) -->
  <link rel="icon" type="image/png" href="img/favicon.png" sizes="32x32 192x192">
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1><span class="plus-accent">+</span> Space Explorer</h1>
    </header>

    <!-- Random Space Fact -->
    <section id="factSection" class="fact-section" aria-live="polite">
      <h2 class="fact-title">Did You Know?</h2>
      <p id="factText" class="fact-text">Space is awesome. Reload to learn a new fact!</p>
    </section>

    <div class="filters">
      <button id="getImageBtn">Get Space Images</button>
      <!-- New: Load more small batch to keep first view fast -->
      <button id="loadMoreBtn" hidden>Load More</button>
    </div>

    <!-- Loading Message -->
    <div id="loading" class="loading" hidden>🔄 Loading space photos…</div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Simple NASA+ style footer -->
  <footer class="site-footer">
    <!-- Brand row -->
    <div class="footer-brand">
      <span class="plus-accent">+</span> Space Explorer
    </div>
    <!-- Helpful quick links (placeholder targets) -->
    <nav class="footer-links" aria-label="Footer links">
      <a href="https://www.nasa.gov" target="_blank" rel="noopener">NASA.gov</a>
      <a href="https://www.nasa.gov/accessibility/" target="_blank" rel="noopener">Accessibility</a>
      <a href="https://www.nasa.gov/privacy/" target="_blank" rel="noopener">Privacy</a>
      <a href="https://www.nasa.gov/foia/" target="_blank" rel="noopener">FOIA</a>
    </nav>
    <p class="footer-copy">Educational demo – images from NASA APOD API.</p>
  </footer>

  <!-- Modal for larger image and details -->
  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="modalTitle" aria-describedby="modalDesc">
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-content" role="document">
      <button id="modalClose" class="modal-close" aria-label="Close">×</button>
      <img id="modalImage" src="" alt="Space image" class="modal-image" decoding="async" />
      <div class="modal-meta">
        <h3 id="modalTitle" class="modal-title"></h3>
        <p id="modalDate" class="modal-date"></p>
        <p id="modalDesc" class="modal-desc"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
